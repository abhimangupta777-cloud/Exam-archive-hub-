<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Exam Archive Hub</title>

    <link rel="stylesheet" href="Style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f7f7ff,
                    #eeeeff
                );

            font-family:
                Arial,
                sans-serif;
        }

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;

            background: white;

            border:
                1px solid #e5e6ec;

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 20px 60px
                rgba(20,25,50,.10);
        }

        .auth-logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .auth-logo-icon {
            width: 55px;
            height: 55px;

            margin: auto;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5b4bff;

            color: white;

            font-weight: 900;
            font-size: 16px;

            box-shadow:
                0 8px 25px
                rgba(91,75,255,.25);
        }

        .auth-logo h1 {
            margin: 13px 0 4px;

            font-size: 21px;
        }

        .auth-logo p {
            margin: 0;

            color: #858a96;

            font-size: 10px;
        }

        .auth-tabs {
            display: grid;

            grid-template-columns: 1fr 1fr;

            background: #f5f5fa;

            padding: 4px;

            border-radius: 10px;

            margin-bottom: 24px;
        }

        .auth-tab {
            border: none;

            padding: 11px;

            border-radius: 7px;

            background: transparent;

            color: #858a96;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;
        }

        .auth-tab.active {
            background: white;

            color: #5b4bff;

            box-shadow:
                0 2px 8px
                rgba(20,25,50,.06);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            color: #30343b;

            font-size: 10px;

            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #dedfe7;

            border-radius: 9px;

            outline: none;

            font-size: 11px;

            transition: .2s;
        }

        .form-group input:focus {
            border-color: #5b4bff;

            box-shadow:
                0 0 0 3px
                rgba(91,75,255,.08);
        }

        .password-row {
            position: relative;
        }

        .password-row input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #5b4bff;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;
        }

        .form-options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 5px;

            color: #858a96;

            font-size: 9px;
        }

        .remember input {
            accent-color: #5b4bff;
        }

        .forgot {
            border: none;

            background: transparent;

            color: #5b4bff;

            font-size: 9px;

            font-weight: 700;
        }

        .auth-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 9px;

            background: #5b4bff;

            color: white;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            transition: .2s;
        }

        .auth-button:hover {
            opacity: .9;

            transform:
                translateY(-1px);
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 22px 0;

            color: #a0a4ae;

            font-size: 9px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #eeeeF3;
        }

        .google-button {
            width: 100%;

            border:
                1px solid #dedfe7;

            background: white;

            color: #30343b;

            padding: 12px;

            border-radius: 9px;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;
        }

        .terms {
            margin-top: 20px;

            color: #9a9da6;

            font-size: 8px;

            line-height: 1.6;

            text-align: center;
        }

        .back-home {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #5b4bff;

            font-size: 9px;

            font-weight: 800;

            text-decoration: none;
        }

        .message {
            display: none;

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            background: #f0efff;

            color: #5b4bff;

            font-size: 9px;

            text-align: center;
        }

        @media(max-width: 480px) {

            .auth-page {
                padding: 15px;
            }

            .auth-container {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<main class="auth-page">


    <div class="auth-container">


        <!-- LOGO -->

        <div class="auth-logo">

            <div class="auth-logo-icon">
                EA
            </div>

            <h1>
                Exam Archive Hub
            </h1>

            <p>
                Your personal learning space
            </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="loginTab"
                onclick="showLogin()">

                Login

            </button>


            <button
                class="auth-tab"
                id="signupTab"
                onclick="showSignup()">

                Create Account

            </button>

        </div>


        <div
            class="message"
            id="message">
        </div>


        <!-- =========================
             LOGIN
        ========================= -->

        <form
            class="auth-form active"
            id="loginForm"
            onsubmit="login(event)">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword')">

                        Show

                    </button>

                </div>

            </div>


            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox">

                    Remember me

                </label>


                <button
                    type="button"
                    class="forgot"
                    onclick="forgotPassword()">

                    Forgot password?

                </button>

            </div>


            <button
                class="auth-button"
                type="submit">

                Login to Dashboard

            </button>


        </form>



        <!-- =========================
             SIGNUP
        ========================= -->

        <form
            class="auth-form"
            id="signupForm"
            onsubmit="signup(event)">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('signupPassword')">

                        Show

                    </button>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword')">

                        Show

                    </button>

                </div>

            </div>


            <button
                class="auth-button"
                type="submit">

                Create Student Account

            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <button
            class="google-button"
            onclick="googleLogin()">

            🌐 Continue with Google

        </button>


        <p class="terms">

            By continuing, you agree to our
            Terms of Service and Privacy Policy.

        </p>


        <a
            href="Index.html"
            class="back-home">

            ← Back to Exam Archive Hub

        </a>


    </div>


</main>



<script>


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");


    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("signupForm")
        .classList.remove("active");


    hideMessage();

}



/* =========================
   SHOW SIGNUP
========================= */

function showSignup() {

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");


    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("loginForm")
        .classList.remove("active");


    hideMessage();

}



/* =========================
   PASSWORD
========================= */

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "
