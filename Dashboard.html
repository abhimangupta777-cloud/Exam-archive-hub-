<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Exam Archive Hub Student Dashboard">

    <title>Student Dashboard | Exam Archive Hub</title>

    <link rel="stylesheet" href="Style.css">

    <style>

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard-page {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px 70px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 28px;
        }

        .welcome-text span {
            color: #5b4bff;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .welcome-text h1 {
            margin: 7px 0 5px;

            font-size: 30px;
        }

        .welcome-text p {
            margin: 0;

            color: #858a96;

            font-size: 11px;
        }


        /* =========================
           PROFILE
        ========================= */

        .profile-box {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #5b4bff;

            color: white;

            font-size: 14px;

            font-weight: 900;
        }

        .profile-box strong {
            display: block;

            font-size: 11px;
        }

        .profile-box span {
            display: block;

            margin-top: 3px;

            color: #858a96;

            font-size: 9px;
        }


        /* =========================
           STAT CARDS
        ========================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 13px;

            margin-bottom: 28px;
        }

        .stat-card {
            background: white;

            border:
                1px solid #e5e6ec;

            border-radius: 15px;

            padding: 20px;

            transition: .2s;
        }

        .stat-card:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(20,25,50,.06);
        }

        .stat-icon {
            font-size: 20px;

            margin-bottom: 13px;
        }

        .stat-card strong {
            display: block;

            font-size: 24px;
        }

        .stat-card span {
            display: block;

            margin-top: 4px;

            color: #858a96;

            font-size: 9px;
        }


        /* =========================
           MAIN GRID
        ========================= */

        .dashboard-grid {
            display: grid;

            grid-template-columns:
                1.7fr 1fr;

            gap: 18px;

            margin-bottom: 25px;
        }


        /* =========================
           DASHBOARD CARD
        ========================= */

        .dashboard-card {
            background: white;

            border:
                1px solid #e5e6ec;

            border-radius: 17px;

            padding: 22px;
        }

        .card-heading {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .card-heading h2 {
            margin: 0;

            font-size: 17px;
        }

        .card-heading button {
            border: none;

            background: transparent;

            color: #5b4bff;

            font-size: 9px;

            font-weight: 800;
        }


        /* =========================
           PROGRESS
        ========================= */

        .subject {
            margin-bottom: 18px;
        }

        .subject:last-child {
            margin-bottom: 0;
        }

        .subject-top {
            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;
        }

        .subject-top strong {
            font-size: 10px;
        }

        .subject-top span {
            color: #858a96;

            font-size: 9px;
        }

        .progress-bar {
            width: 100%;

            height: 7px;

            background: #eeeeF4;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-fill {
            height: 100%;

            width: 0;

            background:
                linear-gradient(
                    90deg,
                    #5b4bff,
                    #8a72ff
                );

            border-radius: 20px;

            transition:
                width 1s ease;
        }


        /* =========================
           QUICK ACTIONS
        ========================= */

        .quick-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;
        }

        .action-btn {
            min-height: 85px;

            border:
                1px solid #e8e8ef;

            border-radius: 11px;

            background: #fafaff;

            padding: 13px;

            text-align: left;

            cursor: pointer;

            transition: .2s;
        }

        .action-btn:hover {
            border-color: #5b4bff;

            background: #f5f3ff;

            transform:
                translateY(-2px);
        }

        .action-btn div {
            font-size: 20px;

            margin-bottom: 8px;
        }

        .action-btn strong {
            display: block;

            font-size: 10px;
        }

        .action-btn span {
            display: block;

            margin-top: 3px;

            color: #858a96;

            font-size: 8px;
        }


        /* =========================
           RECENT PAPERS
        ========================= */

        .recent-list {
            display: flex;

            flex-direction: column;

            gap: 9px;
        }

        .recent-item {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding: 13px;

            border:
                1px solid #eeeeF3;

            border-radius: 11px;
        }

        .recent-info {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .recent-icon {
            width: 35px;
            height: 35px;

            flex-shrink: 0;

            border-radius: 9px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #f0efff;

            color: #5b4bff;

            font-size: 8px;

            font-weight: 900;
        }

        .recent-info strong {
            display: block;

            font-size: 10px;
        }

        .recent-info span {
            display: block;

            margin-top: 3px;

            color: #858a96;

            font-size: 8px;
        }

        .recent-item button {
            border: none;

            background: #f0efff;

            color: #5b4bff;

            padding: 7px 10px;

            border-radius: 7px;

            font-size: 8px;

            font-weight: 800;
        }


        /* =========================
           MOCK TEST
        ========================= */

        .mock-banner {
            background:
                linear-gradient(
                    135deg,
                    #5b4bff,
                    #7a5cff
                );

            color: white;

            border-radius: 17px;

            padding: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .mock-banner h2 {
            margin: 0 0 7px;

            font-size: 20px;
        }

        .mock-banner p {
            margin: 0;

            font-size: 9px;

            opacity: .85;
        }

        .mock-banner button {
            border: none;

            background: white;

            color: #5b4bff;

            padding: 11px 16px;

            border-radius: 8px;

            font-size: 9px;

            font-weight: 900;

            white-space: nowrap;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 850px) {

            .stats-grid {
                grid-template-columns:
                    1fr 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

        }


        @media(max-width: 600px) {

            .dashboard-page {
                padding:
                    25px 14px 50px;
            }

            .welcome {
                align-items: flex-start;
            }

            .welcome-text h1 {
                font-size: 24px;
            }

            .profile-box {
                display: none;
            }

            .stats-grid {
                grid-template-columns:
                    1fr 1fr;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card strong {
                font-size: 20px;
            }

            .mock-banner {
                flex-direction: column;

                align-items: flex-start;
            }

            .mock-banner button {
                width: 100%;
            }

        }

    </style>

</head>
